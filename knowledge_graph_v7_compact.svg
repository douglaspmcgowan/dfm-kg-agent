<svg xmlns="http://www.w3.org/2000/svg" viewBox="10 22 980 370" font-family="Cambria, Georgia, 'Times New Roman', serif">

  <!--
  COMPACT LAYOUT:
    AUTHOR_Q:  (120,  68) r=30
    THREAD:    (450,  68) r=39
    AUTHOR_A1: (590,  68) r=30
    AUTHOR_A2: (860,  68) r=30

    POST_Q:    (120, 203) r=33
