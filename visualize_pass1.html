<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>DFM Knowledge Graph — Pass 1 Preview</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: #0d0f14; color: #c9d1e0;
  font-family: 'Courier New', monospace;
  height: 100vh; display: flex; flex-direction: column; overflow: hidden;
}
header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 10px 18px; background: #13161e;
  border-bottom: 1px solid #1e2535; flex-shrink: 0; gap: 12px; flex-wrap: wrap;
}
.title { font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: #4a9eff; white-space: nowrap; }
.stats { display: flex; gap: 18px; font-size: 11px; color: #445; }
.stat span { color: #c9d1e0; font-weight: bold; }
.controls { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.controls label { font-size: 10px; color: #445; letter-spacing: .06em; text-transform: uppercase; }
select, #search {
  background: #1a1e2a; border: 1px solid #2a3045; color: #c9d1e0;
  border-radius: 3px; padding: 3px 8px;
  font-family: 'Courier New', monospace; font-size: 11px; cursor: pointer;
}
select:focus, #search:focus { outline: 1px solid #4a9eff; }
#search { width: 150px; } #search::placeholder { color: #334; }
input[type=range] {
  width: 70px; accent-color: #4a9eff; cursor: pointer;
}
.btn {
  background: #1a1e2a; border: 1px solid #2a3045; color: #8899bb;
  border-radius: 3px; padding: 4px 11px;
  font-family: 'Courier New', monospace; font-size: 11px; cursor: pointer;
  letter-spacing: .06em; text-transform: uppercase; transition: all .15s;
}
.btn:hover { border-color: #4a9eff; color: #4a9eff; }
.main { display: flex; flex: 1; overflow: hidden; }
#graph { flex: 1; overflow: hidden; cursor: grab; }
#graph:active { cursor: grabbing; }
svg { width: 100%; height: 100%; }
.node circle { stroke-width: 1.5px; cursor: pointer; }
.node circle:hover { stroke-width: 3px; }
.node.selected circle { stroke-width: 3px; }
.node text { font-family: 'Courier New', monospace; fill: #c9d1e0; pointer-events: none; text-anchor: middle; }
.link { stroke: #2a3a55; stroke-opacity: .7; fill: none; }
.link-label { font-family: 'Courier New', monospace; font-size: 8px; fill: #3a5070; pointer-events: none; text-anchor: middle; }
.sidebar {
  width: 270px; flex-shrink: 0; background: #13161e;
  border-left: 1px solid #1e2535; display: flex; flex-direction: column; overflow: hidden;
}
.sidebar-section { padding: 12px 14px; border-bottom: 1px solid #1e2535; flex-shrink: 0; }
.sidebar-section h3 { font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: #4a9eff; margin-bottom: 8px; }
.legend-item {
  display: flex; align-items: center; gap: 7px; font-size: 11px; color: #8899bb;
  margin-bottom: 5px; cursor: pointer; padding: 2px 4px; border-radius: 3px; user-select: none;
}
.legend-item:hover { background: #1e2535; }
.legend-item.muted { opacity: .3; }
.legend-dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
#detail { flex: 1; overflow-y: auto; padding: 12px 14px; }
#detail h3 { font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: #4a9eff; margin-bottom: 10px; }
.detail-name { font-size: 14px; color: #c9d1e0; margin-bottom: 7px; word-break: break-word; }
.detail-type { display: inline-block; font-size: 10px; letter-spacing: .1em; text-transform: uppercase; padding: 2px 7px; border-radius: 2px; margin-bottom: 10px; }
.detail-field { margin-bottom: 8px; font-size: 11px; color: #8899bb; line-height: 1.6; }
.field-label { display: block; color: #445; font-size: 10px; text-transform: uppercase; letter-spacing: .08em; margin-bottom: 2px; }
.conn-list { list-style: none; }
.conn-list li { padding: 3px 0; border-bottom: 1px solid #1e2535; word-break: break-word; }
.conn-pred { color: #f0a050; font-size: 10px; display: block; }
/* Loader */
#loader {
  position: fixed; inset: 0; background: #0d0f14;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  z-index: 100; gap: 14px;
}
#loader h2 { font-size: 13px; letter-spacing: .14em; text-transform: uppercase; color: #4a9eff; }
#loader p { font-size: 12px; color: #445; text-align: center; max-width: 360px; line-height: 1.7; }
.drop-zone {
  width: 300px; height: 110px; border: 1px dashed #2a3045; border-radius: 6px;
  display: flex; align-items: center; justify-content: center; flex-direction: column;
  gap: 7px; cursor: pointer; transition: border-color .2s; font-size: 12px; color: #445;
}
.drop-zone:hover, .drop-zone.drag-over { border-color: #4a9eff; color: #4a9eff; }
#file-input { display: none; }
.arrow-marker { fill: #2a3a55; }
</style>
</head>
<body>

<div id="loader">
  <h2>DFM Graph — Pass 1 Preview</h2>
  <p>Drop your <code>freeform_graph.json</code> here to visualize extracted entities and relationships.</p>
  <div class="drop-zone" id="drop-zone">
    <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
      <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
      <polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/>
    </svg>
    Drop freeform_graph.json here
    <span style="font-size:10px;color:#334">or click to browse</span>
  </div>
  <input type="file" id="file-input" accept=".json">
</div>

<header id="main-header" style="display:none">
  <div class="title">DFM KG — Pass 1</div>
  <div class="stats">
    <div class="stat">Nodes <span id="stat-nodes">—</span></div>
    <div class="stat">Edges <span id="stat-edges">—</span></div>
    <div class="stat">Posts <span id="stat-posts">—</span></div>
  </div>
  <div class="controls">
    <input id="search" type="text" placeholder="Search nodes…">
    <label>Type</label>
    <select id="type-filter"><option value="all">All</option></select>
    <label>Min mentions</label>
    <input type="range" id="min-count" min="1" max="10" value="1">
    <span id="min-label" style="font-size:11px;color:#8899bb;min-width:14px">1</span>
    <button class="btn" id="reset-btn">Reset</button>
    <button class="btn" id="fit-btn">Fit</button>
  </div>
</header>

<div class="main" id="main-ui" style="display:none">
  <div id="graph"></div>
  <div class="sidebar">
    <div class="sidebar-section">
      <h3>Node Types</h3>
      <div id="legend"></div>
    </div>
    <div id="detail">
      <h3>Node Detail</h3>
      <div id="detail-content" style="color:#334;font-size:11px">Click a node to inspect it.</div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>
<script>
if (typeof d3 === 'undefined') {
  document.getElementById('loader').innerHTML = `
    <h2 style="color:#e05580">No internet connection</h2>
    <p style="color:#8899bb;max-width:380px;text-align:center;line-height:1.8">
      This file needs an internet connection to load D3.js the first time.<br><br>
      Open a terminal in your project folder and run:<br>
      <code style="color:#4a9eff">python -m http.server 8080</code><br><br>
      Then open: <code style="color:#4a9eff">http://localhost:8080/visualize_pass1.html</code>
    </p>`;
}

// ─────────────────────────────────────────────────────────────────────────
const PALETTE = [
  '#4a9eff','#f0a050','#50d4a0','#e05580','#a078e0',
  '#50c8d4','#e0c040','#c07850','#80d060','#d060c0',
  '#60a0d0','#d08060','#60d0a0','#a060d0','#d0c060',
];

let typeColorMap = {}, mutedTypes = new Set();
let simulation = null, svgEl, gEl;
let nodeData = [], edgeData = [], allTypes = [];

// ── File loading ──────────────────────────────────────────────────────────
window.addEventListener('DOMContentLoaded', () => {
  if (typeof d3 === 'undefined') return;

  const dropZone  = document.getElementById('drop-zone');
  const fileInput = document.getElementById('file-input');

  dropZone.addEventListener('click', () => fileInput.click());
  fileInput.addEventListener('change', e => readFile(e.target.files[0]));
  dropZone.addEventListener('dragover',  e => { e.preventDefault(); dropZone.classList.add('drag-over'); });
  dropZone.addEventListener('dragleave', () => dropZone.classList.remove('drag-over'));
  dropZone.addEventListener('drop', e => {
    e.preventDefault(); dropZone.classList.remove('drag-over');
    readFile(e.dataTransfer.files[0]);
  });
});

function readFile(file) {
  if (!file) return;
  const r = new FileReader();
  r.onload = e => {
    try { buildGraph(JSON.parse(e.target.result)); }
    catch(err) { alert('Could not parse JSON: ' + err.message); }
  };
  r.readAsText(file);
}

// ── Process raw data ──────────────────────────────────────────────────────
function processRaw(results) {
  const entityMap = {};
  for (const result of results) {
    const pid = result.post_id || 'unknown';
    for (const e of (result.entities || [])) {
      const key = e.name.toLowerCase().trim();
      if (!entityMap[key]) entityMap[key] = { id: key, displayName: e.name, count: 0, types: new Set(), notes: [], postIds: new Set() };
      entityMap[key].count++;
      if (e.type_label) entityMap[key].types.add(e.type_label.toLowerCase().trim());
      if (e.context_note) entityMap[key].notes.push(e.context_note);
      entityMap[key].postIds.add(pid);
    }
  }
  const edgeMap = {};
  for (const result of results) {
    for (const r of (result.relationships || [])) {
      const s = r.subject.toLowerCase().trim();
      const o = r.object.toLowerCase().trim();
      if (!entityMap[s] || !entityMap[o]) continue;
      const key = `${s}||${r.predicate}||${o}`;
      if (!edgeMap[key]) edgeMap[key] = { source: s, target: o, predicate: r.predicate, weight: 0 };
      edgeMap[key].weight++;
    }
  }
  return {
    nodes: Object.values(entityMap).map(n => ({ ...n, types: [...n.types], postIds: [...n.postIds], primaryType: [...n.types][0] || 'unknown' })),
    edges: Object.values(edgeMap)
  };
}

// ── Build graph ───────────────────────────────────────────────────────────
function buildGraph(raw) {
  const { nodes, edges } = processRaw(raw);
  nodeData = nodes; edgeData = edges;

  allTypes = [...new Set(nodes.map(n => n.primaryType))].sort();
  allTypes.forEach((t, i) => { typeColorMap[t] = PALETTE[i % PALETTE.length]; });

  document.getElementById('stat-nodes').textContent = nodes.length;
  document.getElementById('stat-edges').textContent = edges.length;
  document.getElementById('stat-posts').textContent = raw.length;
  document.getElementById('min-count').max = Math.min(Math.max(...nodes.map(n => n.count)), 20);

  buildLegend(); buildTypeFilter();

  document.getElementById('loader').style.display      = 'none';
  document.getElementById('main-header').style.display = 'flex';
  document.getElementById('main-ui').style.display     = 'flex';

  initSVG();
  applyFilters();

  document.getElementById('search').addEventListener('input', applyFilters);
  document.getElementById('type-filter').addEventListener('change', applyFilters);
  document.getElementById('min-count').addEventListener('input', () => {
    document.getElementById('min-label').textContent = document.getElementById('min-count').value;
    applyFilters();
  });
  document.getElementById('reset-btn').addEventListener('click', resetFilters);
  document.getElementById('fit-btn').addEventListener('click', fitView);
}

// ── SVG init ──────────────────────────────────────────────────────────────
let zoomBehavior;

function initSVG() {
  const container = document.getElementById('graph');
  svgEl = d3.select('#graph').append('svg');

  svgEl.append('defs').append('marker')
    .attr('id','arrowhead').attr('viewBox','0 -4 8 8')
    .attr('refX', 20).attr('refY', 0)
    .attr('markerWidth', 6).attr('markerHeight', 6)
    .attr('orient','auto')
    .append('path').attr('d','M0,-4L8,0L0,4').attr('class','arrow-marker');

  gEl = svgEl.append('g');

  zoomBehavior = d3.zoom().scaleExtent([0.05, 5])
    .on('zoom', e => gEl.attr('transform', e.transform));
  svgEl.call(zoomBehavior);
}

// ── Filter + redraw ───────────────────────────────────────────────────────
function applyFilters() {
  const query = (document.getElementById('search')?.value || '').toLowerCase().trim();
  const tf    = document.getElementById('type-filter')?.value || 'all';
  const min   = parseInt(document.getElementById('min-count')?.value || '1');

  const visNodes = nodeData.filter(n => {
    if (n.count < min) return false;
    if (tf !== 'all' && !n.types.includes(tf)) return false;
    if (mutedTypes.size && n.types.every(t => mutedTypes.has(t))) return false;
    if (query && !n.displayName.toLowerCase().includes(query)) return false;
    return true;
  });

  const visIds   = new Set(visNodes.map(n => n.id));
  const visEdges = edgeData.filter(e => visIds.has(e.source) && visIds.has(e.target));

  drawSim(visNodes, visEdges);
}

function drawSim(nodes, edges) {
  if (!gEl) return;
  gEl.selectAll('*').remove();
  if (simulation) { simulation.stop(); simulation = null; }

  const W = document.getElementById('graph').clientWidth;
  const H = document.getElementById('graph').clientHeight;

  const sNodes = nodes.map(n => ({ ...n }));
  const byId   = Object.fromEntries(sNodes.map(n => [n.id, n]));
  const sEdges = edges.map(e => ({ ...e, source: byId[e.source] || e.source, target: byId[e.target] || e.target }));

  simulation = d3.forceSimulation(sNodes)
    .force('link',      d3.forceLink(sEdges).id(d => d.id).distance(110).strength(0.25))
    .force('charge',    d3.forceManyBody().strength(-140))
    .force('center',    d3.forceCenter(W / 2, H / 2))
    .force('collision', d3.forceCollide().radius(d => r(d) + 5));

  // Links
  const link = gEl.append('g').selectAll('line').data(sEdges).enter().append('line')
    .attr('class','link')
    .attr('stroke-width', d => Math.min(4, 0.8 + d.weight * 0.6))
    .attr('marker-end','url(#arrowhead)');

  // Edge labels
  const elabel = gEl.append('g').selectAll('text').data(sEdges).enter().append('text')
    .attr('class','link-label').text(d => d.predicate);

  // Nodes
  const drag = d3.drag()
    .on('start', (ev, d) => { if (!ev.active) simulation.alphaTarget(0.3).restart(); d.fx = d.x; d.fy = d.y; })
    .on('drag',  (ev, d) => { d.fx = ev.x; d.fy = ev.y; })
    .on('end',   (ev, d) => { if (!ev.active) simulation.alphaTarget(0); d.fx = null; d.fy = null; });

  const node = gEl.append('g').selectAll('g').data(sNodes).enter().append('g')
    .attr('class','node').call(drag)
    .on('click', (ev, d) => {
      ev.stopPropagation();
      gEl.selectAll('.node').classed('selected', false);
      d3.select(ev.currentTarget).classed('selected', true);
      showDetail(d, sEdges, byId);
    });

  svgEl.on('click', () => {
    gEl.selectAll('.node').classed('selected', false);
    document.getElementById('detail-content').innerHTML = '<span style="color:#334">Click a node to inspect it.</span>';
  });

  node.append('circle')
    .attr('r', d => r(d))
    .attr('fill', d => (typeColorMap[d.primaryType] || '#4a9eff') + '22')
    .attr('stroke', d => typeColorMap[d.primaryType] || '#4a9eff');

  node.append('text')
    .attr('dy', d => r(d) + 11)
    .style('font-size', d => Math.max(8, Math.min(12, 7 + d.count)) + 'px')
    .text(d => d.displayName.length > 22 ? d.displayName.slice(0, 20) + '…' : d.displayName);

  simulation.on('tick', () => {
    link.attr('x1', d => d.source.x).attr('y1', d => d.source.y)
        .attr('x2', d => d.target.x).attr('y2', d => d.target.y);
    elabel.attr('x', d => (d.source.x + d.target.x) / 2).attr('y', d => (d.source.y + d.target.y) / 2);
    node.attr('transform', d => `translate(${d.x},${d.y})`);
  });
}

function r(d) { return Math.max(6, Math.min(28, 5 + d.count * 3)); }

function fitView() {
  const W = document.getElementById('graph').clientWidth;
  const H = document.getElementById('graph').clientHeight;
  svgEl.transition().duration(500).call(zoomBehavior.transform, d3.zoomIdentity.translate(W * 0.1, H * 0.1).scale(0.8));
}

function resetFilters() {
  document.getElementById('search').value = '';
  document.getElementById('type-filter').value = 'all';
  document.getElementById('min-count').value = 1;
  document.getElementById('min-label').textContent = '1';
  mutedTypes.clear();
  document.querySelectorAll('.legend-item').forEach(el => el.classList.remove('muted'));
  applyFilters();
}

// ── Legend ────────────────────────────────────────────────────────────────
function buildLegend() {
  const c = document.getElementById('legend'); c.innerHTML = '';
  allTypes.forEach(type => {
    const color = typeColorMap[type];
    const el = document.createElement('div');
    el.className = 'legend-item'; el.dataset.type = type;
    el.innerHTML = `<div class="legend-dot" style="background:${color}"></div><span>${type}</span>`;
    el.addEventListener('click', () => {
      mutedTypes.has(type) ? (mutedTypes.delete(type), el.classList.remove('muted'))
                           : (mutedTypes.add(type),    el.classList.add('muted'));
      applyFilters();
    });
    c.appendChild(el);
  });
}

function buildTypeFilter() {
  const sel = document.getElementById('type-filter');
  sel.innerHTML = '<option value="all">All</option>';
  allTypes.forEach(t => { const o = document.createElement('option'); o.value = t; o.textContent = t; sel.appendChild(o); });
}

// ── Detail panel ──────────────────────────────────────────────────────────
function showDetail(node, edges, byId) {
  const color = typeColorMap[node.primaryType] || '#4a9eff';
  const out = edges.filter(e => (e.source.id || e.source) === node.id);
  const inc = edges.filter(e => (e.target.id || e.target) === node.id);

  let html = `<div class="detail-name">${node.displayName}</div>
    <span class="detail-type" style="background:${color}22;color:${color}">${node.primaryType}</span>`;

  if (node.types.length > 1)
    html += `<div class="detail-field"><span class="field-label">All labels</span>${node.types.join(', ')}</div>`;

  html += `<div class="detail-field"><span class="field-label">Mentions</span>${node.count} post${node.count !== 1 ? 's' : ''}</div>`;

  if (node.postIds.length)
    html += `<div class="detail-field"><span class="field-label">Post IDs</span>${node.postIds.slice(0,5).join(', ')}${node.postIds.length > 5 ? ' …' : ''}</div>`;

  if (node.notes.length)
    html += `<div class="detail-field"><span class="field-label">Context</span>${node.notes.slice(0,2).map(n => `<div style="color:#7a8fa8;margin-bottom:3px">${n}</div>`).join('')}</div>`;

  const connBlock = (list, dir) => {
    if (!list.length) return '';
    const rows = list.slice(0, 8).map(e => {
      const other = byId[dir === 'out' ? (e.target.id || e.target) : (e.source.id || e.source)];
      return `<li><span class="conn-pred">${e.predicate}</span>${other ? other.displayName : '?'}${e.weight > 1 ? ` <span style="color:#4a9eff">×${e.weight}</span>` : ''}</li>`;
    }).join('');
    const more = list.length > 8 ? `<li style="color:#334">…${list.length - 8} more</li>` : '';
    return `<div class="detail-field"><span class="field-label">${dir === 'out' ? 'Outgoing' : 'Incoming'} (${list.length})</span><ul class="conn-list">${rows}${more}</ul></div>`;
  };

  html += connBlock(out, 'out') + connBlock(inc, 'in');
  document.getElementById('detail-content').innerHTML = html;
}
</script>
</body>
</html>
